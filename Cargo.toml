[workspace]
members = ["derive"]

[workspace.package]
version = "0.3.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/tell-rs/etch"

[workspace.dependencies]
etchdb-derive = { path = "derive", version = "=0.3.3" }

[package]
name = "etchdb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A fast, embedded database for Rust. Minimal dependencies. No C code. No build scripts."
authors = ["Tell Contributors"]

[features]
default = []
async = ["tokio"]
compression = ["zstd"]

[dependencies]
etchdb-derive.workspace = true
xxhash-rust = { version = "0.8", features = ["xxh3"] }
parking_lot = "0.12"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "bench"
harness = false
